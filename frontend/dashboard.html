<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamForge — Ingestion Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root{
    --bg: #07090c;
    --bg-alt: #0a0d11;
    --surface: #10141b;
    --surface-2: #171d26;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.12);
    --ember: #ff6a28;
    --ember-dim: #a8461a;
    --ember-glow: rgba(255,106,40,0.15);
    --signal: #34d1c4;
    --signal-dim: #1f7d76;
    --signal-glow: rgba(52,209,196,0.15);
    --text: #f0f3f6;
    --text-dim: #a2aebf;
    --text-faint: #636e7f;
    --display: 'Space Grotesk', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  a{ color: inherit; text-decoration: none; }

  /* Background Grid and Glowing Orbs */
  .bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.01) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.01) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: center;
  }
  .glow-orb-1 {
    position: absolute;
    top: -150px; left: 15%;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 106, 40, 0.04) 0%, transparent 70%);
    filter: blur(60px);
  }

  /* ---------- NAV ---------- */
  header.nav{
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    background: rgba(7, 9, 12, 0.4);
    backdrop-filter: blur(10px);
  }
  .nav-inner{
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-mark{
    width: 24px; height:24px;
    position:relative;
    flex-shrink:0;
    filter: drop-shadow(0 2px 8px rgba(255, 106, 40, 0.4));
  }
  .logo-mark svg{ width:100%; height:100%; }

  .user-profile {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .user-identity {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
  }
  .btn-logout {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    padding: 8px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.25s;
  }
  .btn-logout:hover {
    border-color: #ff5f56;
    color: #ff5f56;
    background: rgba(255, 95, 86, 0.05);
  }

  /* ---------- MAIN CONTENT ---------- */
  .main-wrapper {
    flex-grow: 1;
    z-index: 5;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 32px;
  }

  @media (max-width: 960px) {
    .main-wrapper {
      grid-template-columns: 1fr;
    }
  }

  /* Left Column: Stats & Queue */
  .dashboard-main {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* Stats Cards Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 640px) {
    .stats-grid {
      grid-template-columns: 1fr;
    }
  }
  .stat-card {
    background: linear-gradient(135deg, rgba(16,20,27,0.7) 0%, rgba(10,13,17,0.5) 100%);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    backdrop-filter: blur(10px);
    position: relative;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .stat-value {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  /* Panel Common Styling */
  .panel {
    background: linear-gradient(135deg, rgba(16,20,27,0.7) 0%, rgba(10,13,17,0.5) 100%);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px;
    backdrop-filter: blur(10px);
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .panel-title {
    font-family: var(--display);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* Refresh Button */
  .btn-refresh {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .btn-refresh:hover {
    border-color: var(--signal);
    color: var(--signal);
  }

  /* Ingestion Queue Table */
  .table-container {
    width: 100%;
    overflow-x: auto;
  }
  .tasks-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    text-align: left;
  }
  .tasks-table th {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.05em;
  }
  .tasks-table td {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    vertical-align: middle;
  }
  .tasks-table tr:hover td {
    background: rgba(255,255,255,0.01);
  }

  /* Status Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    font-family: var(--mono);
  }
  .badge-uploaded { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border: 1px solid rgba(255,255,255,0.08); }
  .badge-pending { background: rgba(52, 209, 196, 0.05); color: var(--signal); border: 1px solid rgba(52,209,196,0.1); }
  .badge-processing { background: rgba(255, 106, 40, 0.05); color: var(--ember); border: 1px solid rgba(255,106,40,0.1); }
  .badge-completed { background: rgba(46, 204, 113, 0.05); color: #2ecc71; border: 1px solid rgba(46,204,113,0.1); }
  .badge-failed { background: rgba(255, 95, 86, 0.05); color: #ff5f56; border: 1px solid rgba(255,95,86,0.1); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 0;
    color: var(--text-faint);
    font-size: 14px;
  }

  /* Actions list */
  .actions-cell {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .btn-action {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    transition: color 0.2s;
  }
  .btn-action.play {
    color: var(--signal);
  }
  .btn-action.play:hover {
    color: #4dfdf0;
  }
  .btn-action.delete {
    color: var(--text-faint);
  }
  .btn-action.delete:hover {
    color: #ff5f56;
  }

  /* Right Column: Ingest Video Form */
  .dashboard-side {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* Drag and Drop Box */
  .upload-zone {
    border: 1px dashed var(--border-strong);
    background: rgba(7,9,12,0.3);
    border-radius: 6px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 20px;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--ember);
    background: rgba(255,106,40,0.02);
  }
  .upload-icon {
    margin-bottom: 12px;
    color: var(--text-faint);
    transition: color 0.2s;
  }
  .upload-zone:hover .upload-icon {
    color: var(--ember);
  }
  .upload-text {
    font-size: 13.5px;
    color: var(--text-dim);
  }
  .upload-hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  #file-input {
    display: none;
  }

  /* Input fields inside side panel */
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    background: rgba(7, 9, 12, 0.4);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 10px 14px;
    font-family: var(--body);
    font-size: 13.5px;
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .form-group textarea {
    resize: none;
    height: 80px;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--ember);
    box-shadow: 0 0 0 3px rgba(255, 106, 40, 0.1);
  }

  .btn-submit {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 12px 0;
    background: var(--ember);
    color: #07090c;
    border: 1px solid var(--ember);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover {
    background: #ff7d42;
    border-color: #ff7d42;
    box-shadow: 0 4px 16px rgba(255, 106, 40, 0.2);
  }
  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Selected file display indicator */
  .file-indicator {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 20px;
    font-size: 12.5px;
  }
  .file-name {
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
    font-family: var(--mono);
  }
  .btn-remove-file {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 16px;
  }
  .btn-remove-file:hover {
    color: #ff5f56;
  }

  /* Progress status logs */
  .progress-panel {
    display: none;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 4px;
    margin-top: 16px;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-bar-container {
    width: 100%;
    height: 4px;
    background: var(--border-strong);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    width: 0%;
    height: 100%;
    background: var(--ember);
    transition: width 0.3s ease;
  }

  /* Toast alerts */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: #10141b;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 16px 20px;
    font-size: 13.5px;
    color: var(--text);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 1000;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .toast.success { border-color: var(--signal); }
  .toast.error { border-color: #ff5f56; }

  /* ---------- HLS PLAYBACK MODAL ---------- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(7, 9, 12, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal.show {
    display: flex;
  }
  .modal-content {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    width: 100%;
    max-width: 800px;
    padding: 32px;
    position: relative;
    box-shadow: 0 24px 60px rgba(0,0,0,0.8);
  }
  .modal-close {
    position: absolute;
    top: 20px; right: 20px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover {
    color: var(--text);
  }
  .video-container {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .video-container video {
    width: 100%;
    height: 100%;
  }

  /* Spinner */
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(7,9,12,0.2);
    border-top: 2px solid currentColor;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

</style>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-grid"></div>
  <div class="glow-orb-1"></div>
</div>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 12h5v10l8-10h-5V2z" fill="#ff6a28"/></svg>
      </span>
      <a href="index.html">StreamForge</a>
    </div>
    <div class="user-profile">
      <span class="user-identity" id="user-display">Identity: --</span>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>
  </div>
</header>

<main class="main-wrapper">
  
  <!-- Left Side: Ingest Stats & Transcoding Tasks -->
  <section class="dashboard-main">
    
    <!-- Stats Summary Row -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Ingested</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Processing Queue</div>
        <div class="stat-value" id="stat-queue">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ingestion Success</div>
        <div class="stat-value" id="stat-success">0%</div>
      </div>
    </div>

    <!-- Video Queue Ingest Panel -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Ingestion Tasks</h2>
        <button class="btn-refresh" id="refresh-btn" aria-label="Refresh list">
          <svg height="16" width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>

      <div class="table-container">
        <table class="tasks-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Filename</th>
              <th>Size</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tasks-tbody">
            <!-- Dynamic tasks rows -->
            <tr>
              <td colspan="5" class="empty-state">Loading ingestion tasks...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </section>

  <!-- Right Side: Ingestion Upload Panel -->
  <section class="dashboard-side">
    <div class="panel">
      <h2 class="panel-title" style="margin-bottom: 20px;">Ingest Raw Input</h2>
      
      <form id="upload-form">
        <!-- Drag and Drop Box -->
        <div class="upload-zone" id="drop-zone">
          <svg class="upload-icon" height="32" width="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
          <div class="upload-text">Drag & drop raw MP4 / MKV input</div>
          <div class="upload-hint">or click to browse filesystem</div>
          <input type="file" id="file-input" accept="video/mp4,video/mkv,video/x-matroska">
        </div>

        <!-- Selected File Label -->
        <div class="file-indicator" id="file-indicator-block">
          <span class="file-name" id="selected-file-name">file.mp4</span>
          <button type="button" class="btn-remove-file" id="remove-file-btn">&times;</button>
        </div>

        <div class="form-group">
          <label for="video-title">Resource Title</label>
          <input type="text" id="video-title" placeholder="e.g. Creator Stream Session 4" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="video-desc">Ingestion Notes / Description</label>
          <textarea id="video-desc" placeholder="Details about this video input resource..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn" disabled>
          Ingest Video Stream
        </button>
      </form>

      <!-- Upload Progress Indicators -->
      <div class="progress-panel" id="progress-block">
        <div class="progress-header">
          <span id="progress-state">Uploading...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- Custom HLS Modal Player -->
<div class="modal" id="video-modal">
  <div class="modal-content">
    <button class="modal-close" id="close-modal-btn">&times;</button>
    <h3 id="modal-video-title" style="margin-bottom: 20px; font-family: var(--display); font-size: 20px;">Video Stream</h3>
    <div class="video-container">
      <video id="video-player" controls></video>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast" id="toast-block">Notification</div>

<script>
  // Auth Guard
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = 'login.html';
  }

  // Parse payload username
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    const tokenObj = JSON.parse(jsonPayload);
    document.getElementById('user-display').textContent = `Identity: ${tokenObj.sub || 'Creator'}`;
  } catch (e) {
    document.getElementById('user-display').textContent = 'Identity: Creator';
  }

  // API Base Detection
  const API_BASE = window.location.origin.includes('localhost:8080') ? '' : 'http://localhost:8080';

  // Elements
  const logoutBtn = document.getElementById('logout-btn');
  const refreshBtn = document.getElementById('refresh-btn');
  const tasksTbody = document.getElementById('tasks-tbody');
  const statTotal = document.getElementById('stat-total');
  const statQueue = document.getElementById('stat-queue');
  const statSuccess = document.getElementById('stat-success');

  const uploadForm = document.getElementById('upload-form');
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const fileIndicatorBlock = document.getElementById('file-indicator-block');
  const selectedFileName = document.getElementById('selected-file-name');
  const removeFileBtn = document.getElementById('remove-file-btn');
  const videoTitle = document.getElementById('video-title');
  const videoDesc = document.getElementById('video-desc');
  const submitBtn = document.getElementById('submit-btn');

  const progressBlock = document.getElementById('progress-block');
  const progressState = document.getElementById('progress-state');
  const progressPercent = document.getElementById('progress-percent');
  const progressBarFill = document.getElementById('progress-bar-fill');

  const toastBlock = document.getElementById('toast-block');

  const videoModal = document.getElementById('video-modal');
  const modalVideoTitle = document.getElementById('modal-video-title');
  const videoPlayer = document.getElementById('video-player');
  const closeModalBtn = document.getElementById('close-modal-btn');

  let activePollInterval = null;
  let selectedFile = null;

  // Logout Action
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('token');
    window.location.href = 'login.html';
  });

  // Show toast notification helper
  function showToast(msg, type = 'success') {
    toastBlock.textContent = msg;
    toastBlock.className = `toast show ${type}`;
    setTimeout(() => {
      toastBlock.classList.remove('show');
    }, 3000);
  }

  // Formatting helper
  function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  // Format Date helper
  function formatDate(dateStr) {
    if (!dateStr) return '--';
    const date = new Date(dateStr);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Fetch Videos list
  async function fetchVideos(isAutoRefresh = false) {
    if (!isAutoRefresh) {
      refreshBtn.disabled = true;
      refreshBtn.innerHTML = '<span class="spinner"></span>';
    }

    try {
      const response = await fetch(`${API_BASE}/api/videos?size=100`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (!response.ok) {
        if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = 'login.html';
          return;
        }
        throw new Error('Could not retrieve task queue.');
      }

      const data = await response.json();
      const videos = data.content || [];
      renderVideosTable(videos);
      updateStats(videos);

      // Check if there are active jobs in the queue
      const hasActiveJobs = videos.some(v => ['UPLOADED', 'PENDING', 'PROCESSING'].includes(v.status));
      if (hasActiveJobs) {
        startPolling();
      } else {
        stopPolling();
      }
    } catch (err) {
      if (!isAutoRefresh) {
        showToast(err.message, 'error');
      }
    } finally {
      if (!isAutoRefresh) {
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<svg height="16" width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>';
      }
    }
  }

  // Render Videos into Queue Table
  function renderVideosTable(videos) {
    if (videos.length === 0) {
      tasksTbody.innerHTML = `
        <tr>
          <td colspan="5" class="empty-state">No videos found. Ingest one to get started!</td>
        </tr>
      `;
      return;
    }

    tasksTbody.innerHTML = videos.map(video => {
      const statusLower = video.status.toLowerCase();
      let statusBadge = `<span class="badge badge-${statusLower}">${video.status}</span>`;
      
      // If processing, show progress indication animation
      if (video.status === 'PROCESSING') {
        statusBadge = `
          <div style="display:flex; flex-direction:column; gap:4px; max-width: 120px;">
            <span class="badge badge-processing">PROCESSING</span>
            <div class="progress-bar-container" style="height:2px;">
              <div class="progress-bar-fill" style="width: 50%; background: var(--ember); animation: pulse 1.5s infinite;"></div>
            </div>
          </div>
        `;
      }

      const canPlay = video.status === 'COMPLETED' && video.masterPlaylistUrl;
      const playAction = canPlay 
        ? `<button class="btn-action play" onclick="playVideoStream('${video.videoId}', '${video.title}', '${video.masterPlaylistUrl}')">Play Stream</button>`
        : `<span style="font-family:var(--mono); font-size:11px; color:var(--text-faint);">Unavailable</span>`;

      return `
        <tr>
          <td>
            <div style="font-weight: 600; color: var(--text);">${escapeHtml(video.title || 'Untitled')}</div>
            <div style="font-size: 11px; color: var(--text-faint); margin-top: 4px;">Uploaded ${formatDate(video.uploadedAt)}</div>
          </td>
          <td style="font-family: var(--mono); font-size: 12.5px;">${escapeHtml(video.originalFileName)}</td>
          <td>${formatBytes(video.fileSize)}</td>
          <td>${statusBadge}</td>
          <td>
            <div class="actions-cell">
              ${playAction}
              <button class="btn-action delete" onclick="deleteVideoItem('${video.videoId}')">Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  // Update Ingestion Counters
  function updateStats(videos) {
    statTotal.textContent = videos.length;

    const queueCount = videos.filter(v => ['UPLOADED', 'PENDING', 'PROCESSING'].includes(v.status)).length;
    statQueue.textContent = queueCount;

    const completedCount = videos.filter(v => v.status === 'COMPLETED').length;
    const successRate = videos.length > 0 ? Math.round((completedCount / videos.length) * 100) : 0;
    statSuccess.textContent = `${successRate}%`;
  }

  // Delete video logic
  async function deleteVideoItem(videoId) {
    if (!confirm('Are you sure you want to delete this ingestion task? This deletes files from backing storage too.')) {
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/api/videos/${videoId}`, {
        method: 'DELETE',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (!response.ok) throw new Error('Could not delete video task.');

      showToast('Video resource deleted successfully.');
      fetchVideos();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // Auto Polling for active transcode queues
  function startPolling() {
    if (activePollInterval) return;
    activePollInterval = setInterval(() => {
      fetchVideos(true);
    }, 5000);
  }

  function stopPolling() {
    if (activePollInterval) {
      clearInterval(activePollInterval);
      activePollInterval = null;
    }
  }

  // File drag & drop triggers
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      handleSelectedFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      handleSelectedFile(fileInput.files[0]);
    }
  });

  function handleSelectedFile(file) {
    selectedFile = file;
    selectedFileName.textContent = file.name;
    fileIndicatorBlock.style.display = 'flex';
    dropZone.style.display = 'none';

    // Autofill title if empty
    if (!videoTitle.value) {
      const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
      videoTitle.value = baseName.replace(/[_-]/g, ' ');
    }
    submitBtn.disabled = false;
  }

  removeFileBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    fileIndicatorBlock.style.display = 'none';
    dropZone.style.display = 'block';
    submitBtn.disabled = true;
  });

  // Handle Ingest Upload Form Submit
  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedFile) return;

    // Show Progress Block
    progressBlock.style.display = 'block';
    submitBtn.disabled = true;
    removeFileBtn.style.disabled = true;

    try {
      const formData = new FormData();
      formData.append('file', selectedFile);

      // Construct metadata JSONBlob part
      const metadataBlob = new Blob([JSON.stringify({
        title: videoTitle.value,
        description: videoDesc.value
      })], { type: 'application/json' });
      formData.append('metadata', metadataBlob);

      // Perform Fetch XHR with Progress support (using clean XMLHttpRequest)
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${API_BASE}/api/files/upload`);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);

      // Track Upload Progress
      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progressPercent.textContent = `${percent}%`;
          progressBarFill.style.width = `${percent}%`;
          
          if (percent === 100) {
            progressState.textContent = 'Transmitting to backend metadata storage...';
          }
        }
      });

      xhr.onload = function() {
        progressBlock.style.display = 'none';
        progressBarFill.style.width = '0%';
        progressPercent.textContent = '0%';

        if (xhr.status >= 200 && xhr.status < 300) {
          showToast('Video submitted successfully to the processing queue.');
          uploadForm.reset();
          selectedFile = null;
          fileIndicatorBlock.style.display = 'none';
          dropZone.style.display = 'block';
          
          fetchVideos();
        } else {
          try {
            const errData = JSON.parse(xhr.responseText);
            showToast(errData.message || 'File upload failed.', 'error');
          } catch(e) {
            showToast('Ingestion upload failed.', 'error');
          }
          submitBtn.disabled = false;
        }
      };

      xhr.onerror = function() {
        progressBlock.style.display = 'none';
        showToast('Connection failed during file transfer.', 'error');
        submitBtn.disabled = false;
      };

      xhr.send(formData);

    } catch(err) {
      progressBlock.style.display = 'none';
      showToast(err.message, 'error');
      submitBtn.disabled = false;
    }
  });

  // HTML escape helper
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // Play HLS Stream Modal handler
  function playVideoStream(videoId, title, playlistUrl) {
    modalVideoTitle.textContent = title;
    videoModal.classList.add('show');

    // Detect if full URL or relative
    let videoSrc = playlistUrl;
    if (!playlistUrl.startsWith('http')) {
      // Resolve path
      videoSrc = `${API_BASE}${playlistUrl}`;
    }

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(videoPlayer);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        videoPlayer.play();
      });
      
      // Cleanup on close
      closeModalBtn.onclick = () => {
        hls.destroy();
        videoPlayer.pause();
        videoPlayer.src = '';
        videoModal.classList.remove('show');
      };
    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      // Native Safari/iOS support
      videoPlayer.src = videoSrc;
      videoPlayer.addEventListener('loadedmetadata', function() {
        videoPlayer.play();
      });

      closeModalBtn.onclick = () => {
        videoPlayer.pause();
        videoPlayer.src = '';
        videoModal.classList.remove('show');
      };
    } else {
      showToast('HLS playback is not supported on this browser version.', 'error');
    }
  }

  // Initial load
  fetchVideos();
</script>

</body>
</html>
