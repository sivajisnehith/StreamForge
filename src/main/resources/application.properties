spring.application.name=StreamForge
streamforge.storage.upload-dir=uploads
streamforge.storage.processed-dir=storage/processed

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
streamforge.storage.max-file-size=524288000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:streamforge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ Connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:streamforge}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:streamforge_pass}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# MinIO / S3 Connection
minio.url=${STORAGE_ENDPOINT:http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}}
minio.access-key=${STORAGE_ACCESS_KEY:admin}
minio.secret-key=${STORAGE_SECRET_KEY:password123}
minio.original-bucket=${STORAGE_ORIGINAL_BUCKET:originals}
minio.processed-bucket=${STORAGE_PROCESSED_BUCKET:processed}
minio.region=${STORAGE_REGION:ap-south-1}

# JWT Configuration
jwt.secret=${JWT_SECRET:streamforge-secret-key-streamforge-secret-key-123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CloudFront CDN Configuration
streamforge.cdn.url=${CLOUDFRONT_URL:}
